name: An idea
description: Something Waveband could show or do.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Waveband only reads the game's log and the screen, and never touches the game process, so some things other meters show
        (crit rate, per-skill damage, healing) are not possible: the log does not carry them.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like, and when you would use it.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it would go
      description: On the meter, the dashboard, the settings, somewhere else?
